name: Build and Release

# اجرای خودکار با Push به شاخه اصلی، اجرای دستی و ایجاد Tag نسخه
on:
  push:
    branches:
      - main
      - test
    tags:
      - 'v*'
  workflow_dispatch:

# برای ساخت GitHub Release نیاز به دسترسی نوشتن محتوا وجود دارد
permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'IndustrialSensorMonitor.sln'
  PROJECT_PATH: 'src/IndustrialSensorMonitor/IndustrialSensorMonitor.csproj'
  TEST_PROJECT_PATH: 'tests/IndustrialSensorMonitor.Tests/IndustrialSensorMonitor.Tests.csproj'
  CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: Build, Package and Release
    runs-on: windows-latest

    steps:
      - name: دریافت سورس کد
        uses: actions/checkout@v7

      - name: نصب .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: کش پکیج‌های NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: نمایش اطلاعات محیط Build
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "ساختار Solution:"
          Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName

      - name: تعیین شماره نسخه
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
            Write-Host "نسخه از Tag گرفته شد."
          }
          else {
            [xml]$project = Get-Content -Path '${{ env.PROJECT_PATH }}'
            $version = @($project.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($version)) { $version = '1.0.0' }
            Write-Host "نسخه از فایل پروژه خوانده شد."
          }
          Write-Host "شماره نسخه: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: بازیابی پکیج‌های NuGet (Restore)
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: ساخت پروژه (Build)
        run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: اجرای تست‌ها
        shell: pwsh
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} `
            -c ${{ env.CONFIGURATION }} `
            --no-build `
            -p:Version=${{ steps.version.outputs.version }} `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory TestResults 2>&1 | Tee-Object -FilePath test-console.txt
          $exitCode = $LASTEXITCODE

          # هر تست ناموفق به‌صورت Annotation در صفحه اجرا نمایش داده می‌شود
          $trx = Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            [xml]$result = Get-Content $trx.FullName
            $failed = @($result.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })
            foreach ($test in $failed) {
              $message = ''
              if ($test.Output -and $test.Output.ErrorInfo) {
                $message = "$($test.Output.ErrorInfo.Message) || $($test.Output.ErrorInfo.StackTrace)"
              }
              $message = ($message -replace "`r?`n", ' / ')
              if ($message.Length -gt 800) { $message = $message.Substring(0, 800) }
              Write-Host "::error title=Test failed: $($test.testName)::$message"
            }
            Write-Host "تعداد تست‌های ناموفق: $($failed.Count)"
          }
          else {
            Write-Host "::warning::فایل نتیجه تست‌ها پیدا نشد؛ احتمالاً ساخت یا اجرای تست‌ها پیش از تولید trx متوقف شده است."
          }

          exit $exitCode

      - name: بررسی قالب‌بندی کد (dotnet format)
        id: format
        # این بررسی مسدودکننده نیست تا یک اختلاف قالب‌بندی، انتشار نسخه را متوقف نکند؛
        # نتیجه آن در خلاصه اجرا (Summary)، Annotationها و Artifact «format-report» دیده می‌شود.
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --severity warn --no-restore *>&1 |
            Tee-Object -FilePath format-report.txt
          $exitCode = $LASTEXITCODE

          '### بررسی قالب‌بندی کد' >> $env:GITHUB_STEP_SUMMARY

          if ($exitCode -eq 0) {
            Write-Host 'قالب‌بندی کد بدون مشکل است.'
            '✅ `dotnet format --verify-no-changes` بدون خطا اجرا شد.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          Write-Host "::warning::بررسی قالب‌بندی مواردی پیدا کرد (کد خروج $exitCode)."
          '⚠️ `dotnet format --verify-no-changes` مواردی پیدا کرد؛ جزئیات در Annotationهای همین اجرا و Artifact «format-report» است.' >> $env:GITHUB_STEP_SUMMARY

          $lines = Get-Content format-report.txt
          $emitted = 0
          foreach ($line in $lines) {
            if ($emitted -ge 20) { break }
            if ($line -match '^(?<file>[A-Za-z]:\\[^\(]+\.cs|/[^\(]+\.cs)\((?<line>\d+),(?<col>\d+)\):\s*(?:error|warning)\s*(?<rule>[A-Za-z0-9]+)?\s*:?\s*(?<msg>.+)$') {
              Write-Host "::warning file=$($Matches['file']),line=$($Matches['line'])::$($Matches['rule']) :: $($Matches['msg'])"
              $emitted++
            }
          }

          if ($emitted -eq 0) {
            $tail = $lines | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 12
            foreach ($line in $tail) { Write-Host "::warning::$line" }
          }

      - name: بارگذاری گزارش قالب‌بندی
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-report
          path: format-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: نمایش خلاصه نتایج تست‌ها
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) {
            '### نتایج تست‌ها' >> $env:GITHUB_STEP_SUMMARY
            'فایل نتیجه تست‌ها (trx) پیدا نشد.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          [xml]$result = Get-Content -Path $trx.FullName
          $counters = $result.TestRun.ResultSummary.Counters
          $outcome = $result.TestRun.ResultSummary.Outcome

          '### نتایج تست‌ها' >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '| وضعیت | تعداد |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          "| موفق | $($counters.passed) |" >> $env:GITHUB_STEP_SUMMARY
          "| ناموفق | $($counters.failed) |" >> $env:GITHUB_STEP_SUMMARY
          "| رد‌شده | $($counters.notExecuted) |" >> $env:GITHUB_STEP_SUMMARY
          "| **مجموع** | **$($counters.total)** |" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          "نتیجه کلی: **$outcome**" >> $env:GITHUB_STEP_SUMMARY

      - name: انتشار فایل اجرایی (Self-contained, Single File)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c ${{ env.CONFIGURATION }}
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/win-x64

      - name: بررسی خروجی انتشار
        shell: pwsh
        run: |
          $exePath = 'publish/win-x64/IndustrialSensorMonitor.exe'
          if (-not (Test-Path $exePath)) { throw "فایل اجرایی IndustrialSensorMonitor.exe تولید نشد." }

          $existsAppSettings = Test-Path 'publish/win-x64/appsettings.json'
          if (-not $existsAppSettings) {
            Copy-Item 'src/IndustrialSensorMonitor/appsettings.json' 'publish/win-x64/appsettings.json' -Force
            Write-Host "فایل appsettings.json در خروجی نبود و از سورس کپی شد."
          }

          $exeSize = (Get-Item $exePath).Length
          if ($exeSize -lt 1MB) { throw "حجم فایل اجرایی غیرمنتظره است: $exeSize بایت" }

          Write-Host "محتوای پوشه انتشار:"
          Get-ChildItem 'publish/win-x64' -Recurse | Format-Table FullName, Length

      - name: نصب Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'کامپایلر Inno Setup (ISCC.exe) پیدا نشد.' }
          Write-Host "ISCC: $iscc"
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: ساخت فایل نصب ویندوز (Setup.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $env:ISCC_PATH 'installer\Setup.iss' "/DMyAppVersion=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "ساخت فایل نصب با خطا مواجه شد (کد خروج: $LASTEXITCODE)." }
          if (-not (Test-Path 'dist/IndustrialSensorMonitor-Setup-x64.exe')) {
            throw 'فایل IndustrialSensorMonitor-Setup-x64.exe تولید نشد.'
          }

      - name: آماده‌سازی خروجی‌های نهایی در پوشه dist
        shell: pwsh
        run: |
          Copy-Item 'publish/win-x64/IndustrialSensorMonitor.exe' 'dist/IndustrialSensorMonitor.exe' -Force

          $portableRoot = 'portable/IndustrialSensorMonitor-Portable'
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item 'publish/win-x64/IndustrialSensorMonitor.exe' "$portableRoot/" -Force
          Copy-Item 'publish/win-x64/appsettings.json' "$portableRoot/" -Force
          Copy-Item 'README.md' "$portableRoot/README.md" -Force

          Compress-Archive -Path $portableRoot -DestinationPath 'dist/IndustrialSensorMonitor-Portable-x64.zip' -Force

          $required = @(
            'dist/IndustrialSensorMonitor.exe',
            'dist/IndustrialSensorMonitor-Setup-x64.exe',
            'dist/IndustrialSensorMonitor-Portable-x64.zip'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "فایل خروجی تولید نشد: $file" }
            if ((Get-Item $file).Length -lt 1KB) { throw "فایل خروجی خالی یا ناقص است: $file" }
          }

          Write-Host "خروجی‌های نهایی:"
          Get-ChildItem dist | Format-Table Name, Length

      - name: بارگذاری Artifact فایل اجرایی
        uses: actions/upload-artifact@v7
        with:
          name: IndustrialSensorMonitor-EXE
          path: dist/IndustrialSensorMonitor.exe
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری Artifact فایل نصب
        uses: actions/upload-artifact@v7
        with:
          name: IndustrialSensorMonitor-Setup
          path: dist/IndustrialSensorMonitor-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری Artifact نسخه قابل حمل
        uses: actions/upload-artifact@v7
        with:
          name: IndustrialSensorMonitor-Portable
          path: dist/IndustrialSensorMonitor-Portable-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری گزارش تست‌ها
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 7

      - name: انتشار GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $version = '${{ steps.version.outputs.version }}'

          $notes = @(
            "## Industrial Sensor Monitor $version",
            "",
            "سامانه ثبت و مدیریت اطلاعات سنسورهای صنعتی (C# / Windows Forms / ذخیره‌سازی JSON محلی)",
            "",
            "### فایل‌های این نسخه",
            "- ``IndustrialSensorMonitor-Setup-x64.exe`` — فایل نصب ویندوز (پیشنهادی)",
            "- ``IndustrialSensorMonitor.exe`` — فایل اجرایی مستقل (Self-contained)",
            "- ``IndustrialSensorMonitor-Portable-x64.zip`` — نسخه قابل حمل",
            "",
            "### پیش‌نیازها",
            "- Windows 10/11 (64-bit)",
            "- بدون نیاز به SQL Server یا هر دیتابیس دیگری (ذخیره‌سازی در فایل JSON محلی)",
            "",
            "### نکته",
            "- نیازی به نصب جداگانه .NET Runtime نیست (خروجی Self-contained).",
            "- اطلاعات در فایل ``sensors.json`` در مسیر ``%LOCALAPPDATA%\\IndustrialSensorMonitor\\Data`` ذخیره می‌شود.",
            "- در اولین اجرا، فایل داده همراه با رکوردهای نمونه ساخته می‌شود.",
            "- حذف (Uninstall) برنامه، فایل داده و اطلاعات ثبت‌شده را پاک نمی‌کند."
          ) -join "`n"

          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8NoBOM

          gh release create $tag `
            'dist/IndustrialSensorMonitor-Setup-x64.exe' `
            'dist/IndustrialSensorMonitor.exe' `
            'dist/IndustrialSensorMonitor-Portable-x64.zip' `
            --title "Industrial Sensor Monitor $tag" `
            --notes-file release-notes.md `
            --verify-tag

          if ($LASTEXITCODE -ne 0) { throw "ساخت GitHub Release با خطا مواجه شد." }
          Write-Host "GitHub Release برای نسخه $tag با موفقیت منتشر شد."
